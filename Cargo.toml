[package]
name = "grafana-cli"
version = "0.1.0"
edition = "2021"
description = "A Rust CLI for Grafana: list/find dashboards and generate CLI-mode metrics/charts/dashboards."
license = "MIT"
readme = "README.md"
keywords = ["grafana", "cli", "prometheus", "observability"]
categories = ["command-line-utilities"]

[[bin]]
name = "grafana-cli"
path = "src/main.rs"

[dependencies]
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
dirs = "5"
comfy-table = "7"
owo-colors = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"

[profile.release]
lto = true
strip = true
